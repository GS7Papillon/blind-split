<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BlindSplit" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
  <title>BlindSplit</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <h1>BlindSplit</h1>
        <p id="user-badge" class="subtitle hidden"></p>
      </div>
      <button id="logout-btn" class="btn-ghost hidden" type="button">Abmelden</button>
    </header>

    <div id="status-banner" class="banner hidden" role="alert"></div>

    <!-- ANSICHT 1: LOGIN & REGISTRIERUNG -->
    <main id="auth-view" class="card">
      <div class="tabs">
        <button id="tab-login" class="tab active" type="button">Einloggen</button>
        <button id="tab-register" class="tab" type="button">Registrieren</button>
      </div>

      <form id="auth-form">
        <div id="name-field-group" class="field hidden">
          <label for="auth-name">Anzeigename</label>
          <input id="auth-name" type="text" placeholder="z. B. Max" autocomplete="name" />
        </div>

        <div class="field">
          <label for="auth-email">E-Mail</label>
          <input id="auth-email" type="email" required placeholder="name@beispiel.de" autocomplete="email" />
        </div>

        <div class="field">
          <label for="auth-password">Passwort</label>
          <input id="auth-password" type="password" required minlength="6" placeholder="Mindestens 6 Zeichen" autocomplete="current-password" />
        </div>

        <button id="auth-submit-btn" class="btn-primary" type="submit">Einloggen</button>
      </form>
    </main>

    <!-- ANSICHT 2: HAUPT-APP -->
    <main id="app-view" class="hidden">
      <!-- 1. Gesamtsalden -->
      <section class="card">
        <div class="section-header">
          <h2>Aktuelle Bilanz</h2>
          <button id="refresh-btn" class="btn-small" type="button">Aktualisieren</button>
        </div>
        <p class="hint">Es wird ausschließlich der gegenseitig verrechnete Endbetrag angezeigt.</p>
        <div id="balances-list" class="list"></div>
      </section>

      <!-- 2. Neuen Posten eintragen -->
      <section class="card">
        <h2>Neuen Posten eintragen</h2>
        <form id="debt-form">
          <div class="field">
            <label for="counterpart-select">Person</label>
            <select id="counterpart-select" required></select>
          </div>

          <div class="field">
            <label for="direction-select">Richtung</label>
            <select id="direction-select" required>
              <option value="owes_me">Diese Person schuldet mir Geld</option>
              <option value="i_owe">Ich schulde dieser Person Geld</option>
            </select>
          </div>

          <div class="field">
            <label for="amount-input">Betrag (€)</label>
            <input id="amount-input" type="number" step="0.01" min="0.01" required placeholder="z. B. 14.50" />
          </div>

          <div class="field">
            <label for="title-input">Titel (Pflicht)</label>
            <input id="title-input" type="text" required minlength="2" maxlength="80" placeholder="z. B. Pizza Freitagabend" />
          </div>

          <div class="field">
            <label for="reason-input">Begründung (Pflicht)</label>
            <textarea id="reason-input" rows="2" required minlength="3" maxlength="250" placeholder="z. B. Habe die gemeinsame Bestellung komplett ausgelegt"></textarea>
          </div>

          <button class="btn-primary" type="submit">Posten speichern</button>
        </form>
      </section>

      <!-- 3. Nur eigene Einträge -->
      <section class="card">
        <h2>Meine eingetragenen Posten</h2>
        <p class="hint">Nur du siehst diese Liste. Einträge anderer Mitglieder bleiben für dich unsichtbar.</p>
        <div id="my-debts-list" class="list"></div>
      </section>
    </main>
  </div>

  <!-- Supabase Client Bibliothek -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
